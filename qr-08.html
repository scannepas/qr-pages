<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Non.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Syne:wght@800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #030303;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
    background-size: 100% 4px, 6px 100%;
    z-index: 10;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.95) 100%);
    pointer-events: none;
    z-index: 9;
  }

  .container {
    position: relative;
    z-index: 5;
    max-width: 600px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .question {
    font-size: 1.1rem;
    color: #666;
    margin-bottom: 20px;
    font-style: italic;
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(-20px);
    animation: slide-down 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.2s;
  }

  .non {
    font-family: 'Syne', sans-serif;
    font-size: 8rem;
    font-weight: 800;
    color: #fff;
    line-height: 0.95;
    user-select: none;
    position: relative;
    opacity: 0;
    transform: scale(3);
    filter: blur(10px);
    animation: slam 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards,
               chromatic-glitch 4s infinite step-end;
    animation-delay: 0.6s;
    letter-spacing: -2px;
  }

  @media(max-width: 480px) {
    .non { font-size: 6.5rem; }
    .question { font-size: 0.95rem; }
  }

  .period {
    color: #ff3344;
    text-shadow: 0 0 20px rgba(255, 51, 68, 0.6);
    display: inline-block;
    animation: pulse 1.5s infinite alternate;
  }

  .subtext {
    margin-top: 40px;
    font-size: 0.8rem;
    color: #333;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in 1s ease forwards;
    animation-delay: 1.5s;
  }

  .shake {
    animation: heavy-shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes slide-down { to { opacity: 1; transform: translateY(0); } }
  @keyframes slam {
    0% { transform: scale(3.5); filter: blur(15px); opacity: 0; }
    70% { filter: blur(0); }
    100% { transform: scale(1); filter: blur(0); opacity: 1; }
  }
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes pulse {
    from { transform: scale(1); filter: brightness(1); }
    to { transform: scale(1.1); filter: brightness(1.3); }
  }
  @keyframes heavy-shake {
    10%, 90% { transform: translate3d(-4px, -2px, 0) rotate(-1deg); }
    20%, 80% { transform: translate3d(6px, 4px, 0) rotate(1.5deg); }
    30%, 50%, 70% { transform: translate3d(-8px, -1px, 0) rotate(-1.5deg); }
    40%, 60% { transform: translate3d(8px, 3px, 0) rotate(1deg); }
  }
  @keyframes chromatic-glitch {
    0%, 95%, 100% { text-shadow: none; }
    96% { text-shadow: -3px 0 #00ffff, 3px 0 #ff3344; }
    97% { text-shadow: 3px -2px #00ffff, -3px 2px #ff3344; }
    98% { text-shadow: -2px 3px #00ffff, 2px -3px #ff3344; }
    99% { text-shadow: 2px -1px #00ffff, -2px 1px #ff3344; }
  }
</style>
</head>
<body>
  <div class="vignette"></div>
  <canvas id="shockwaveCanvas"></canvas>

  <div class="container" id="interactiveContainer">
    <div class="question">La réponse à toutes tes questions :</div>
    <div class="non" id="targetWord">NON<span class="period">.</span></div>
    <div class="subtext">— fin —</div>
  </div>

  <script>
    const canvas = document.getElementById('shockwaveCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('interactiveContainer');
    const targetWord = document.getElementById('targetWord');
    let audioCtx = null;
    let particles = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(x, y, isBlast = false) {
        this.x = x; this.y = y;
        this.size = Math.random() * (isBlast ? 4 : 2) + 1;
        this.speedX = isBlast ? (Math.random() * 12 - 6) : (Math.random() * 1.5 - 0.75);
        this.speedY = isBlast ? (Math.random() * 12 - 6) : (Math.random() * -1.5 - 0.5);
        this.color = isBlast ? (Math.random() > 0.4 ? '#ff3344' : '#ffffff') : 'rgba(255,255,255,0.2)';
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
      }
      update() { this.x += this.speedX; this.y += this.speedY; this.alpha -= this.decay; }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));

    function animate() {
      ctx.fillStyle = 'rgba(3,3,3,0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => { p.update(); p.draw(); return p.alpha > 0; });
      if (particles.filter(p => p.speedX < 2).length < 30)
        particles.push(new Particle(Math.random() * canvas.width, canvas.height + 10));
      requestAnimationFrame(animate);
    }
    animate();

    function playBassDrop() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.4);
        gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch(e) {}
    }

    function punchInteractivity(e) {
      let clientX = window.innerWidth / 2, clientY = window.innerHeight / 2;
      if (e.touches && e.touches[0]) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      else if (e.clientX) { clientX = e.clientX; clientY = e.clientY; }
      for (let i = 0; i < 35; i++) particles.push(new Particle(clientX, clientY, true));
      playBassDrop();
      if (navigator.vibrate) navigator.vibrate([60, 40, 80]);
      container.classList.remove('shake');
      void container.offsetWidth;
      container.classList.add('shake');
      targetWord.style.transform = 'scale(1.15)';
      setTimeout(() => { targetWord.style.transform = ''; }, 150);
    }

    document.body.addEventListener('mousedown', punchInteractivity);
    document.body.addEventListener('touchstart', (e) => { e.preventDefault(); punchInteractivity(e); }, { passive: false });
  </script>
</body>
</html>
