<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Compte à rebours</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Space+Grotesk:wght@400;700;900&family=Syne:wght@800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #070709;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    background-size: 100% 4px, 6px 100%;
    z-index: 10;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 20%, rgba(5, 5, 7, 0.95) 100%);
    pointer-events: none;
    z-index: 9;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.3;
  }

  .console {
    position: relative;
    z-index: 5;
    max-width: 480px;
    width: 100%;
    padding: 40px 24px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 24px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transform: scale(0.95);
    opacity: 0;
    animation: boot-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .label {
    font-size: 0.85rem;
    color: #666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    font-weight: 700;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  .label.finished { color: #00ffcc; text-shadow: 0 0 15px rgba(0, 255, 204, 0.5); }

  .countdown {
    font-family: 'Fira Code', monospace;
    font-size: 7.5rem;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-block;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
  }

  .countdown.tick-active { transform: scale(1.15); color: #ff3344; text-shadow: 0 0 40px rgba(255, 51, 68, 0.6); }
  .countdown.finished { color: #00ffcc; text-shadow: 0 0 40px rgba(0, 255, 204, 0.6); animation: text-glitch 0.4s step-end; }

  .subtitle {
    font-size: 0.8rem;
    color: #444;
    margin-top: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    transition: color 0.3s ease;
  }

  .subtitle.finished { color: #666; }

  .reveal {
    margin-top: 36px;
    font-size: 1.3rem;
    color: #aaa;
    display: none;
    opacity: 0;
    transform: translateY(15px);
    animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .punchline {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    color: #fff;
    font-weight: 800;
    margin-top: 12px;
    display: none;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    opacity: 0;
    transform: translateY(15px);
    animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.15s;
  }

  .shake { animation: heavy-shake 0.35s cubic-bezier(.36,.07,.19,.97) both; }
  .flash-cyan { animation: cyan-flash 0.3s ease-out; }

  @keyframes boot-up { to { transform: scale(1); opacity: 1; } }
  @keyframes slide-up { to { opacity: 1; transform: translateY(0); } }
  @keyframes heavy-shake {
    10%, 90% { transform: translate3d(-3px, -2px, 0) rotate(-0.5deg); }
    20%, 80% { transform: translate3d(4px, 3px, 0) rotate(1deg); }
    30%, 50%, 70% { transform: translate3d(-6px, -1px, 0) rotate(-1deg); }
    40%, 60% { transform: translate3d(6px, 2px, 0) rotate(0.5deg); }
  }
  @keyframes cyan-flash {
    0% { background: rgba(0, 255, 204, 0.4); }
    100% { background: #070709; }
  }
  @keyframes text-glitch {
    0% { text-shadow: -3px 0 #00ffff, 3px 0 #ff3344; transform: translate(-2px, 1px); }
    30% { text-shadow: 3px -2px #00ffff, -3px 2px #ff3344; transform: translate(2px, -1px); }
    70% { text-shadow: -2px 2px #00ffff, 2px -2px #ff3344; transform: translate(-1px, -2px); }
    100% { text-shadow: 0 0 40px rgba(0, 255, 204, 0.6); transform: translate(0); }
  }
</style>
</head>
<body>

  <div class="vignette"></div>
  <canvas id="digitalCanvas"></canvas>

  <div class="console" id="displayBox">
    <div class="label" id="label">Compte à rebours vers...</div>
    <div class="countdown" id="num">5</div>
    <div class="subtitle" id="sub">quelque chose d'extraordinaire</div>
    <div class="reveal" id="reveal">...voilà.</div>
    <div class="punchline" id="punch">C'était ça. 🙃</div>
  </div>

  <script>
    const canvas = document.getElementById('digitalCanvas');
    const ctx = canvas.getContext('2d');
    const box = document.getElementById('displayBox');
    const labelEl = document.getElementById('label');
    const numEl = document.getElementById('num');
    const subEl = document.getElementById('sub');
    const revealEl = document.getElementById('reveal');
    const punchEl = document.getElementById('punch');
    let audioCtx = null;
    let particles = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class Spark {
      constructor(isBlast = false, x = 0, y = 0) { this.reset(isBlast, x, y); }
      reset(isBlast, x, y) {
        this.x = isBlast ? x : Math.random() * canvas.width;
        this.y = isBlast ? y : Math.random() * canvas.height;
        this.size = Math.random() * (isBlast ? 4 : 1.5) + 0.5;
        this.speedX = isBlast ? (Math.random() * 12 - 6) : (Math.random() * 1.5 - 0.75);
        this.speedY = isBlast ? (Math.random() * 12 - 6) : (Math.random() * -1.2 - 0.3);
        this.color = isBlast ? (Math.random() > 0.4 ? '#00ffcc' : '#ffffff') : 'rgba(255,255,255,0.1)';
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
      }
      update() { this.x += this.speedX; this.y += this.speedY; this.alpha -= this.decay; }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 30; i++) particles.push(new Spark());

    function render() {
      ctx.fillStyle = 'rgba(7, 7, 9, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => { p.update(); p.draw(); return p.alpha > 0; });
      if (particles.filter(p => p.speedY < 0 && p.alpha > 0.2).length < 20)
        particles.push(new Spark());
      requestAnimationFrame(render);
    }
    render();

    function playAudioFreq(freq, type, duration, vol) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + duration);
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function triggerHaptic(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }

    document.addEventListener('DOMContentLoaded', () => {
      let countdownVal = 5;
      const interval = setInterval(() => {
        countdownVal--;
        numEl.textContent = countdownVal;
        numEl.classList.add('tick-active');
        setTimeout(() => numEl.classList.remove('tick-active'), 120);
        playAudioFreq(1200, 'sine', 0.05, 0.08);
        triggerHaptic(15);
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        for (let i = 0; i < 8; i++) particles.push(new Spark(true, cx, cy));

        if (countdownVal <= 0) {
          clearInterval(interval);
          labelEl.textContent = 'TERMINÉ';
          labelEl.classList.add('finished');
          numEl.classList.add('finished');
          subEl.classList.add('finished');
          revealEl.style.display = 'block';
          punchEl.style.display = 'block';
          playAudioFreq(180, 'sawtooth', 0.4, 0.2);
          triggerHaptic([60, 45, 120]);
          document.body.classList.add('flash-cyan');
          box.classList.add('shake');
          for (let i = 0; i < 40; i++) particles.push(new Spark(true, cx, cy));
          setTimeout(() => {
            document.body.classList.remove('flash-cyan');
            box.classList.remove('shake');
          }, 400);
        }
      }, 1000);
    });

    document.body.addEventListener('click', (e) => {
      triggerHaptic(8);
      for (let i = 0; i < 6; i++) particles.push(new Spark(true, e.clientX, e.clientY));
    });
  </script>
</body>
</html>
