<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trop tard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Syne:wght@800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #060608;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    background-size: 100% 4px, 6px 100%;
    z-index: 10;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 30%, rgba(3, 3, 5, 0.95) 100%);
    pointer-events: none;
    z-index: 9;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.25;
  }

  .container {
    position: relative;
    z-index: 5;
    max-width: 380px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    perspective: 1000px;
  }

  .meme-box {
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255, 255, 255, 0.05);
    transform: scale(0.9) rotateX(15deg);
    opacity: 0;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
    animation: slam-bounce 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
    animation-delay: 0.1s;
  }

  .meme-top {
    background: #ffffff;
    padding: 18px 16px;
    font-size: 1.05rem;
    font-weight: 900;
    color: #000;
    text-transform: uppercase;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.5px;
    border-bottom: 1px solid #f0f0f0;
  }

  .meme-image {
    background: #111115;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 90px;
    position: relative;
    overflow: hidden;
  }

  .meme-image::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 6px;
    background: linear-gradient(to bottom, rgba(255, 51, 68, 0.8), rgba(255, 51, 68, 0));
    animation: scan-loop 2.5s ease-in-out infinite;
    box-shadow: 0 0 12px rgba(255, 51, 68, 0.8);
  }

  .emoji-span {
    display: inline-block;
    animation: float 4s ease-in-out infinite alternate;
  }

  .meme-bottom {
    background: #ffffff;
    padding: 18px 16px;
    font-size: 1rem;
    font-weight: 900;
    color: #000;
    text-transform: uppercase;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.5px;
    border-top: 1px solid #f0f0f0;
    line-height: 1.3;
  }

  .caption {
    margin-top: 32px;
    color: #777780;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(15px);
    animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.8s;
  }

  .big {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    color: #fff;
    margin-top: 14px;
    letter-spacing: -1px;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(15px);
    animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards,
               chromatic-glitch 4s infinite step-end;
    animation-delay: 1s;
    position: relative;
  }

  .shake { animation: heavy-shake 0.35s cubic-bezier(.36,.07,.19,.97) both; }

  @keyframes slam-bounce {
    0% { transform: scale(1.6) rotateX(25deg) translateY(-40px); opacity: 0; filter: blur(10px); }
    100% { transform: scale(1) rotateX(0deg) translateY(0); opacity: 1; filter: blur(0); }
  }
  @keyframes fade-up { to { opacity: 1; transform: translateY(0); } }
  @keyframes float {
    from { transform: translateY(0) scale(1) rotate(-3deg); }
    to { transform: translateY(-8px) scale(1.05) rotate(3deg); }
  }
  @keyframes scan-loop {
    0% { top: 0%; } 50% { top: 96%; } 100% { top: 0%; }
  }
  @keyframes heavy-shake {
    10%, 90% { transform: translate3d(-2px, -2px, 0) rotate(-0.5deg); }
    20%, 80% { transform: translate3d(3px, 3px, 0) rotate(1deg); }
    30%, 50%, 70% { transform: translate3d(-5px, -1px, 0) rotate(-1deg); }
    40%, 60% { transform: translate3d(5px, 2px, 0) rotate(0.5deg); }
  }
  @keyframes chromatic-glitch {
    0%, 95%, 100% { text-shadow: none; }
    96% { text-shadow: -2.5px 0 #00ffff, 2.5px 0 #ff3344; }
    97% { text-shadow: 2.5px -1.5px #00ffff, -2.5px 1.5px #ff3344; }
    98% { text-shadow: -1.5px 2px #00ffff, 1.5px -2px #ff3344; }
    99% { text-shadow: 1.5px -1px #00ffff, -1.5px 1px #ff3344; }
  }
</style>
</head>
<body>

  <div class="vignette"></div>
  <canvas id="generativeCanvas"></canvas>

  <div class="container" id="interactionTarget">
    <div class="meme-box" id="tiltBox">
      <div class="meme-top">Toi, 2 secondes avant de scanner</div>
      <div class="meme-image">
        <span class="emoji-span">🕵️</span>
      </div>
      <div class="meme-bottom">"ouais c'est sûrement rien d'important"</div>
    </div>
    <div class="caption">Et maintenant t'es là 👇</div>
    <div class="big">💀 GG à toi</div>
  </div>

  <script>
    const canvas = document.getElementById('generativeCanvas');
    const ctx = canvas.getContext('2d');
    const target = document.getElementById('interactionTarget');
    const tiltBox = document.getElementById('tiltBox');
    let audioCtx = null;
    let particles = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class DigitalDust {
      constructor(isBlast = false, x = 0, y = 0) { this.reset(isBlast, x, y); }
      reset(isBlast, x, y) {
        this.x = isBlast ? x : Math.random() * canvas.width;
        this.y = isBlast ? y : Math.random() * canvas.height;
        this.size = Math.random() * (isBlast ? 4 : 2) + 1;
        this.speedX = isBlast ? (Math.random() * 10 - 5) : (Math.random() * 0.4 - 0.2);
        this.speedY = isBlast ? (Math.random() * 10 - 5) : (Math.random() * -1 - 0.2);
        this.color = isBlast ? (Math.random() > 0.4 ? '#ff3344' : '#00ffff') : 'rgba(255,255,255,0.15)';
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
      }
      update() { this.x += this.speedX; this.y += this.speedY; this.alpha -= this.decay; }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new DigitalDust());

    function render() {
      ctx.fillStyle = 'rgba(6, 6, 8, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => { p.update(); p.draw(); return p.alpha > 0; });
      if (particles.filter(p => p.speedY < 0 && p.alpha > 0.2).length < 25)
        particles.push(new DigitalDust());
      requestAnimationFrame(render);
    }
    render();

    function playCyberSlamSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.35);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      } catch(e) {}
    }

    function triggerHaptic(d) { if (navigator.vibrate) navigator.vibrate(d); }

    function triggerInteraction(e) {
      let x = window.innerWidth / 2, y = window.innerHeight / 2;
      if (e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
      else if (e.clientX) { x = e.clientX; y = e.clientY; }
      for (let i = 0; i < 20; i++) particles.push(new DigitalDust(true, x, y));
      target.classList.remove('shake');
      void target.offsetWidth;
      target.classList.add('shake');
      playCyberSlamSound();
      triggerHaptic([30, 25, 40]);
    }

    function handleCardTilt(e) {
      const rect = tiltBox.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const rx = -((cy - rect.top - rect.height/2) / (rect.height/2)) * 12;
      const ry = ((cx - rect.left - rect.width/2) / (rect.width/2)) * 12;
      tiltBox.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(1.03)`;
    }

    function resetCardTilt() { tiltBox.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)'; }

    document.body.addEventListener('mousedown', triggerInteraction);
    document.body.addEventListener('touchstart', (e) => {
      if (e.target.tagName !== 'A') triggerInteraction(e);
    }, { passive: true });
    document.body.addEventListener('mousemove', handleCardTilt);
    document.body.addEventListener('mouseleave', resetCardTilt);
    document.body.addEventListener('touchmove', handleCardTilt, { passive: true });
    document.body.addEventListener('touchend', resetCardTilt);

    window.addEventListener('load', () => { setTimeout(() => triggerHaptic([80, 50, 80]), 100); });
  </script>
</body>
</html>
