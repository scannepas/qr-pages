<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Regarde-moi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;800;900&family=Syne:wght@800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #050508;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    font-family: 'Space Grotesk', sans-serif;
    transition: background 0.15s cubic-bezier(0.19, 1, 0.22, 1);
  }

  body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    background-size: 100% 4px, 6px 100%;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  body.revealed::before { opacity: 0.15; }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 20%, rgba(3, 3, 5, 0.95) 100%);
    pointer-events: none;
    z-index: 9;
    transition: background 0.5s ease;
  }

  body.revealed .vignette {
    background: radial-gradient(circle, transparent 50%, rgba(255, 255, 255, 0.4) 100%);
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  body.revealed canvas { opacity: 0.8; }

  .experience-box {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 400px;
    height: 100%;
    user-select: none;
  }

  .eyes {
    font-size: 9rem;
    transition: transform 0.08s ease-out, filter 0.3s ease;
    user-select: none;
    cursor: pointer;
    filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
    display: inline-block;
    will-change: transform;
    animation: floating-sway 4s ease-in-out infinite alternate;
  }

  .eyes:active { transform: scale(0.9) !important; }

  .eyes.shocked {
    animation: blast-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.5) forwards;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
  }

  .tap-hint {
    position: fixed;
    bottom: 50px;
    color: #16161a;
    font-size: 0.85rem;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s ease;
  }

  .tap-hint.revealed-text {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    color: #000 !important;
    letter-spacing: -0.5px;
    transform: scale(1.05);
    animation: text-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards,
               subtle-shake 0.3s infinite alternate;
    text-align: center;
    width: 90%;
    max-width: 360px;
  }

  .shake-world { animation: heavy-slam 0.4s cubic-bezier(.36,.07,.19,.97) both; }

  @keyframes floating-sway {
    0% { transform: translateY(0px) rotate(-1deg); }
    100% { transform: translateY(-8px) rotate(1deg); }
  }
  @keyframes blast-bounce {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.4); }
    100% { transform: scale(1.15); }
  }
  @keyframes text-pop {
    0% { transform: scale(0.8) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes heavy-slam {
    10%, 90% { transform: translate3d(-3px, -2px, 0); }
    20%, 80% { transform: translate3d(4px, 4px, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, -1px, 0); }
    40%, 60% { transform: translate3d(6px, 2px, 0); }
  }
  @keyframes subtle-shake {
    0% { transform: rotate(-0.5deg); }
    100% { transform: rotate(0.5deg); }
  }
</style>
</head>
<body>

  <div class="vignette"></div>
  <canvas id="generativeCanvas"></canvas>

  <div class="experience-box" id="world">
    <div class="eyes" id="eyes">👀</div>
    <div class="tap-hint" id="hint">appuie sur les yeux</div>
  </div>

  <script>
    const canvas = document.getElementById('generativeCanvas');
    const ctx = canvas.getContext('2d');
    const eyes = document.getElementById('eyes');
    const hint = document.getElementById('hint');
    const world = document.getElementById('world');
    let isRevealed = false;
    let audioCtx = null;
    let particles = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class DarkDust {
      constructor(isBlast = false, x = 0, y = 0) { this.reset(isBlast, x, y); }
      reset(isBlast, x, y) {
        this.isBlast = isBlast;
        this.x = isBlast ? x : Math.random() * canvas.width;
        this.y = isBlast ? y : Math.random() * canvas.height;
        this.size = Math.random() * (isBlast ? 6 : 2.5) + 0.5;
        this.speedX = isBlast ? (Math.random() * 12 - 6) : (Math.random() * 0.4 - 0.2);
        this.speedY = isBlast ? (Math.random() * 12 - 6) : (Math.random() * -0.6 - 0.2);
        this.color = isBlast ? (Math.random() > 0.4 ? '#000000' : 'rgba(0,0,0,0.45)') : 'rgba(255,255,255,0.12)';
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
      }
      update() {
        this.x += this.speedX; this.y += this.speedY;
        if (this.isBlast) { this.alpha -= this.decay; }
        else if (this.y < 0) { this.reset(false); }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 30; i++) particles.push(new DarkDust());

    function render() {
      ctx.fillStyle = isRevealed ? 'rgba(255,255,255,0.2)' : 'rgba(5,5,8,0.18)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => { p.update(); p.draw(); return p.alpha > 0; });
      if (!isRevealed && particles.filter(p => !p.isBlast).length < 25) particles.push(new DarkDust());
      requestAnimationFrame(render);
    }
    render();

    function playSlamSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.55);
        gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.start(); osc.stop(audioCtx.currentTime + 0.6);

        const noiseOsc = audioCtx.createOscillator();
        const noiseGain = audioCtx.createGain();
        noiseOsc.connect(noiseGain); noiseGain.connect(audioCtx.destination);
        noiseOsc.type = 'triangle';
        noiseOsc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        noiseOsc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.2);
        noiseGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
        noiseOsc.start(); noiseOsc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    function triggerHaptic(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }

    function trackingLogic(targetX, targetY) {
      if (isRevealed) return;
      const dx = (targetX / window.innerWidth - 0.5) * 35;
      const dy = (targetY / window.innerHeight - 0.5) * 35;
      eyes.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    document.addEventListener('mousemove', e => trackingLogic(e.clientX, e.clientY));
    document.addEventListener('touchmove', e => {
      if (e.touches && e.touches[0]) trackingLogic(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    setTimeout(() => { if (!isRevealed) hint.style.color = 'rgba(255,255,255,0.4)'; }, 2000);

    eyes.addEventListener('click', (e) => {
      if (isRevealed) return;
      isRevealed = true;
      document.body.style.background = '#ffffff';
      document.body.classList.add('revealed');
      eyes.textContent = '😳';
      eyes.classList.add('shocked');
      eyes.style.transform = 'translate(0px, 0px)';
      hint.textContent = "T'ATTENDAIS PAS À ÇA HEH ?";
      hint.classList.add('revealed-text');
      world.classList.add('shake-world');
      triggerHaptic([60, 40, 100]);
      playSlamSound();
      const rect = eyes.getBoundingClientRect();
      const burstX = rect.left + rect.width / 2;
      const burstY = rect.top + rect.height / 2;
      for (let i = 0; i < 40; i++) particles.push(new DarkDust(true, burstX, burstY));
      setTimeout(() => world.classList.remove('shake-world'), 500);
    });

    document.body.addEventListener('click', () => {
      if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
    }, { once: true });
  </script>
</body>
</html>
