<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chargement...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Space+Grotesk:wght@700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #050505;
    color: #00ff88;
    font-family: 'Fira Code', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
    background-size: 100% 4px, 6px 100%;
    z-index: 10;
    pointer-events: none;
  }
  .crt-vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.95) 100%);
    pointer-events: none;
    z-index: 11;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.12;
  }
  .terminal {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 420px;
    background: rgba(10, 10, 10, 0.8);
    border: 1px solid rgba(0, 255, 136, 0.2);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.05), inset 0 0 15px rgba(0, 255, 136, 0.05);
    border-radius: 12px;
    padding: 30px 24px;
    backdrop-filter: blur(8px);
    animation: boot-up 0.6s cubic-bezier(0.15, 0.85, 0.3, 1) forwards;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem; font-weight: 900;
    margin-bottom: 35px; color: #fff;
    text-transform: uppercase; letter-spacing: -0.5px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
  }
  .loading-group {
    margin-bottom: 24px; text-align: left;
    opacity: 0; transform: translateY(10px);
    animation: fade-in-up 0.5s ease forwards;
  }
  .loading-group:nth-child(2) { animation-delay: 0.2s; }
  .loading-group:nth-child(4) { animation-delay: 0.4s; }
  .loading-group:nth-child(6) { animation-delay: 0.6s; }
  .label {
    font-size: 0.78rem; color: #888; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 1px;
    display: flex; justify-content: space-between; font-weight: 700;
  }
  .label::after {
    content: "[ACTIVE]";
    color: #00ff88; font-size: 0.7rem; opacity: 0.7;
    animation: blink 1.2s infinite;
  }
  .loading-group:nth-child(6) .label::after { animation: status-stall 12s forwards; }
  .bar-container {
    width: 100%; background: rgba(255, 255, 255, 0.03);
    border-radius: 4px; height: 16px; overflow: hidden;
    margin-bottom: 4px; border: 1px solid rgba(255, 255, 255, 0.08);
    position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #00ff88, #00ccff);
    border-radius: 2px;
    animation: fill 8s cubic-bezier(0.1, 0.8, 0.1, 1) forwards;
    position: relative;
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
  }
  .bar::before {
    content: "";
    position: absolute; top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(90deg, transparent 85%, rgba(10, 10, 10, 0.7) 85%);
    background-size: 12px 100%;
  }
  @keyframes fill {
    0% { width: 0%; } 30% { width: 45%; }
    60% { width: 62%; } 80% { width: 63%; } 100% { width: 63%; }
  }
  .status {
    font-size: 1.3rem; font-weight: 700;
    color: #00ff88; margin-top: 32px; letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
    display: inline-block;
  }
  .blink { animation: blink 0.8s infinite steps(2); color: #00ff88; }
  .stuck {
    margin-top: 24px; font-size: 0.82rem; color: #ff4444;
    display: none; padding: 12px;
    border: 1px dashed rgba(255, 68, 68, 0.3);
    background: rgba(255, 68, 68, 0.05);
    border-radius: 6px;
    animation: error-shake 0.3s cubic-bezier(.36,.07,.19,.97) both infinite;
    letter-spacing: 0.5px; font-weight: 700;
  }
  @keyframes boot-up {
    0% { transform: scale(0.96) translateY(10px); opacity: 0; filter: brightness(2); }
    100% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); }
  }
  @keyframes fade-in-up { to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes status-stall {
    0%, 70% { content: "[ACTIVE]"; color: #00ff88; }
    80%, 100% { content: "[STALLED]"; color: #ff4444; }
  }
  @keyframes error-shake {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(1px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-1.5px, 0, 0); }
    40%, 60% { transform: translate3d(1.5px, 0, 0); }
  }
  .screen-shake { animation: intense-shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes intense-shake {
    10%, 90% { transform: translate3d(-3px, -2px, 0) rotate(-0.5deg); }
    20%, 80% { transform: translate3d(4px, 3px, 0) rotate(1deg); }
    30%, 50%, 70% { transform: translate3d(-5px, -1px, 0) rotate(-1deg); }
    40%, 60% { transform: translate3d(5px, 2px, 0) rotate(0.5deg); }
  }
</style>
</head>
<body>
  <div class="crt-vignette"></div>
  <canvas id="digitalParticles"></canvas>

  <div class="terminal" id="terminalBox">
    <h1>⏳ Chargement en cours...</h1>
    <div class="loading-group">
      <div class="label">Chargement de ta vie sociale</div>
      <div class="bar-container"><div class="bar"></div></div>
    </div>
    <div class="loading-group">
      <div class="label">Chargement de tes ambitions</div>
      <div class="bar-container"><div class="bar" style="animation-delay:0.5s"></div></div>
    </div>
    <div class="loading-group">
      <div class="label">Chargement de ta productivité</div>
      <div class="bar-container"><div class="bar" style="animation-delay:1s; animation-duration:12s;"></div></div>
    </div>
    <div class="status">63% <span class="blink">█</span></div>
    <div class="stuck" id="stuck">⚠️ Connexion instable... ou c'est juste toi.</div>
  </div>

  <script>
    const canvas = document.getElementById('digitalParticles');
    const ctx = canvas.getContext('2d');
    const terminal = document.getElementById('terminalBox');
    let audioCtx = null;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    const chars = "01";
    const fontSize = 10;
    let columns = [];
    function initMatrix() {
      const colCount = Math.floor(canvas.width / fontSize) + 1;
      columns = Array(colCount).fill(0).map(() => Math.random() * canvas.height * -1);
    }
    initMatrix();
    window.addEventListener('resize', initMatrix);

    function drawMatrix() {
      ctx.fillStyle = "rgba(5, 5, 5, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0, 255, 136, 0.25)";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < columns.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, columns[i]);
        if (columns[i] > canvas.height && Math.random() > 0.985) columns[i] = 0;
        else columns[i] += fontSize;
      }
    }
    function renderLoop() { drawMatrix(); requestAnimationFrame(renderLoop); }
    renderLoop();

    function playGlitchSynth(freqStart, freqEnd, duration, type = 'triangle') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
        gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function triggerInteraction() {
      terminal.classList.remove('screen-shake');
      void terminal.offsetWidth;
      terminal.classList.add('screen-shake');
      playGlitchSynth(300 + Math.random() * 600, 80 + Math.random() * 40, 0.25, 'sawtooth');
      if (navigator.vibrate) navigator.vibrate([20, 15, 30]);
    }

    document.body.addEventListener('click', triggerInteraction);
    document.body.addEventListener('touchstart', (e) => {
      if (e.target.tagName !== 'A') triggerInteraction();
    }, { passive: true });

    setTimeout(() => {
      document.getElementById('stuck').style.display = 'block';
      if (navigator.vibrate) navigator.vibrate([80, 100, 80]);
      playGlitchSynth(180, 70, 0.6, 'square');
    }, 9000);
  </script>
</body>
</html>
